<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lean cover</title>
<link rel="stylesheet" href="../../tokens.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600&family=Barlow:wght@400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; width: 960px; height: 288px; overflow: hidden; }
  body { background: var(--floor); color: var(--ink); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--floor); }
  .cover svg { position: absolute; left: 0; top: 0; }
  .f-floor { fill: var(--floor); }
  .f-ink { fill: var(--ink); }
  .f-steel { fill: var(--steel); }
  .f-kanban { fill: var(--kanban); }
  .f-green { fill: var(--andon-green); }
  .f-amber { fill: var(--andon-amber); }
  .f-red { fill: var(--andon-red); }
  .name { position: absolute; left: 40px; bottom: 52px; margin: 0; color: var(--ink); white-space: nowrap; }
  .tagline { position: absolute; left: 40px; bottom: 28px; margin: 0; font-family: var(--font-body); font-weight: 400; font-size: 14px; line-height: 20px; color: var(--steel); white-space: nowrap; }
</style>
</head>
<body>
<div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
  <!--
    Derivation:
    blocks x 3: ink panel (x 704-960, 256x288, 26.7 percent of width) from the ink token;
      andon-green block (x 512-704, y 0-144) and steel block (x 512-704, y 144-288), 192x144 each, 10 percent each.
      Blocks total 46.7 percent of the cover, all right of x=480.
    arrangement: one tall panel at the right; two blocks stacked at its left edge, one per half-height.
    pattern: andon stack, three discs in a column (red, amber, green, top to bottom), radius-disc 32px, centred at x=832;
      satellites are discs at radius-md 12px (kanban, andon-amber, kanban), placed on the ink panel.
    steps and radii: radius-disc 32px, radius-md 12px. No gradients, no shadows, no words.
  -->
  <rect class="f-ink" x="704" y="0" width="256" height="288"/>
  <rect class="f-green" x="512" y="0" width="192" height="144"/>
  <rect class="f-steel" x="512" y="144" width="192" height="144"/>
  <circle class="f-red" cx="832" cy="56" r="32"/>
  <circle class="f-amber" cx="832" cy="144" r="32"/>
  <circle class="f-green" cx="832" cy="232" r="32"/>
  <circle class="f-kanban" cx="752" cy="56" r="12"/>
  <circle class="f-kanban" cx="912" cy="144" r="12"/>
  <circle class="f-amber" cx="752" cy="232" r="12"/>
</svg>
<div class="name cover-name">lean</div>
<p class="tagline">Lean mode for AI coding agents.</p>
</div>
</body>
</html>
